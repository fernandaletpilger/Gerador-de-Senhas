<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo">

        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="Cadeado">
            <h2 class="titulo-pricipal">Gerador de Senhas</h2>
            <h3 class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura
            </h3>
        </div>

        <div class="conteudo-senha">
            <label for="campo-senha">Senha</label>
            <input
            type="text"
            id="campo-senha"
            reandoly
            placeholder="Sua senha aparecerá aqui">
        </div>

        <div class="parametro">

            <h3 class="parametro-titulo">
                Personalize sua Senha
            </h3>

            <div class="parametro-coluna_senha">

                <!--Tamanho da Senha-->
                <div class="parametro-senha">

                    <h4 class="parametro-senha_titulo">
                        Número de caracteres 
                    </h4>
                    
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha_botao" type="button">-</button>
                        <p class="parametro-senha_texto">12</p>
                        <button class="parametro-senha_botao" type="button">+</button>
                    </div>

                </div>
                
                <!--Características -->
                <div class="parametro-senha">

                    <h4 class="parametro-senha_titulo">
                        Caracteristicas da senha
                    </h4>

                    <div class="parametro-senha-checkbox">
                        <input
                            type="checkbox"
                            id="maiusculo"
                            class="checkbox"
                            checked>
                        <label for="maiusculo">
                            Letras maiúsculas
                        </label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input
                            type="checkbox"
                            id="maiusculo"
                            class="checkbox"
                            checked>
                        <label for="minusculo">
                            Letras minúsculas
                        </label>
                    </div>

                    <div class="parametro-senha-checkbox">
                        <input
                            type="checkbox"
                            id="numero"
                            class="checkbox"
                            checked>
                        <label for="numero">
                            
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
